call_api:
  name: Sports Radar Call API
  description: Sets the sportsradar sensor based on the input parameters, calls the ESPN API, and populates the sensor attributes.
  target:
    entity:
      domain: sensor
      integration: sportsradar
  fields:
    sport_path:
      name: Sport
      description: Sport path
      required: true
      example: 'football'
      selector:
        text:
    league_path:
      name: League
      description: League path
      required: true
      example: 'nfl'
      selector:
        text:
    team_id:
      name: Team
      description: Team ID
      required: true
      example: 'CLE'
      selector:
        text:
    conference_id:
      name: Conference
      description: Conference ID (only for NCAA)
      required: false
      example: '5'
      selector:
        text:
diagnose:
  name: Sports Radar Diagnose Connection
  description: >-
    Tries several client configurations against SofaScore from this Home
    Assistant host and writes the results to the log. Use this when the sensor
    is unavailable with a 403, to find out whether any configuration is
    accepted from this network.
