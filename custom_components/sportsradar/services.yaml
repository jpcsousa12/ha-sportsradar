call_api:
  name: Sports Radar Call API
  description: >-
    Points the targeted Sports Radar sensors at another team, fetches its
    fixture from SofaScore and updates the sensor attributes. The change lasts
    until Home Assistant restarts or the entry is reloaded.
  target:
    entity:
      domain: sensor
      integration: sportsradar
  fields:
    team_id:
      name: Team
      description: Team name as SofaScore spells it, or its SofaScore numeric id.
      required: true
      example: 'FC Porto'
      selector:
        text:
    sport_path:
      name: Sport
      description: >-
        SofaScore sport slug, for example football, basketball, tennis,
        hockey or american-football. Defaults to football.
      required: false
      example: 'football'
      selector:
        text:
    league_path:
      name: League (ignored)
      description: Deprecated and ignored; SofaScore finds the competition itself.
      required: false
      advanced: true
      selector:
        text:
    conference_id:
      name: Conference (ignored)
      description: Deprecated and ignored.
      required: false
      advanced: true
      selector:
        text:
diagnose:
  name: Sports Radar Diagnose Connection
  description: >-
    Tries several client configurations against SofaScore from this Home
    Assistant host and writes the results to the log. Use this when the sensor
    is unavailable with a 403, to find out whether any configuration is
    accepted from this network.
