name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
          # "brands" requires the domain to be registered in the
          # home-assistant/brands repository, which is a requirement for being
          # listed in HACS by default - not for installing this as a custom
          # repository, which is how it is meant to be used. Every other check
          # must still pass.
          ignore: "brands"