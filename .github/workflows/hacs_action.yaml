name: HACS Action

# HACS validation checks a repository against the requirements for being
# published in HACS. It reads the repo through the GitHub API as an app, which
# cannot see a private repository - so on this fork it fails with
# "integration_manifest: expected a dictionary. Got None" no matter what the
# manifest contains. This fork is not published to HACS, so the workflow runs
# only when asked for. Restore the push/schedule triggers if the repo is ever
# made public and submitted to HACS.
on:
  workflow_dispatch:

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"